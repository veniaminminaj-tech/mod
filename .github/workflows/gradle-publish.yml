name: Build ResourcePack Manager (Forge)

on:
  push:
    branches: [main, resourcepack-manager-1.21.11]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Forge mod
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: resourcepack-manager/forge
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Build and verify
        run: gradle --no-daemon clean build verifyModJar

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: resourcepack-manager-forge-minecraft-1.21.11
          path: resourcepack-manager/forge/build/libs/*.jar
          if-no-files-found: error
