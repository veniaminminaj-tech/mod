name: Build ResourcePack Manager
on:
  push:
    paths:
      - 'resourcepack-manager/**'
  workflow_dispatch:
jobs:
  fabric:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resourcepack-manager/fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: resourcepack-manager-fabric
          path: resourcepack-manager/fabric/build/libs/*.jar
  neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resourcepack-manager/neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: resourcepack-manager-neoforge
          path: resourcepack-manager/neoforge/build/libs/*.jar
