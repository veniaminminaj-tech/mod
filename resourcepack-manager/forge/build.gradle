plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }
        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

// Capture only the metadata values needed by mods.toml during configuration.
// This avoids accessing the Gradle Project object from a task action, which is
// incompatible with Gradle 9's configuration cache.
def metadataVersion = project.version.toString()
def modMetadata = [
    loader_version_range: loader_version_range,
    mod_license: mod_license,
    mod_id: mod_id,
    mod_version: mod_version,
    mod_name: mod_name,
    mod_authors: mod_authors,
    mod_description: mod_description,
    forge_version_range: forge_version_range,
    minecraft_version_range: minecraft_version_range
]

processResources {
    inputs.property 'version', metadataVersion
    inputs.properties modMetadata
    filesMatching('META-INF/mods.toml') {
        expand modMetadata
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors
        ])
    }
}
